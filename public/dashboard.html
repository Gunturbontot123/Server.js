<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard - ObatQU.id</title>
  <link rel="stylesheet" href="/style.css"/>
</head>
<body class="dashboard-body">

<div class="dashboard-layout">

  <!-- ===== SIDEBAR ===== -->
  <aside id="dashboardSidebar" class="dashboard-sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">💊 Obat.Qu</div>
    </div>

    <nav class="sidebar-nav">
      <a href="#" class="nav-item active" data-section="dashboard">
        📊 Dashboard
      </a>

      <a href="#" class="nav-item" data-section="data-obat">
        💊 Data Obat
      </a>

      <a href="#" class="nav-item" data-section="keluar">
        🔄 Keluar
      </a>

      <a href="#" class="nav-item" data-section="ved-fefo">
        📋 VED-FEFO
      </a>

      <hr>

      <a href="#" class="nav-item" id="logoutBtn">
        🚪 Logout
      </a>
    </nav>
  </aside>

  <!-- ===== MAIN ===== -->
  <main class="dashboard-main">

    <!-- HEADER -->
    <header class="dashboard-header">
      <button id="dotMenu" class="dot-menu">☰</button>

      <div class="user-info">
        <div class="user-avatar" id="userAvatar">A</div>
        <div>
          <div id="userName">Admin</div>
          <small>Online</small>
        </div>
      </div>
    </header>

    <div class="dashboard-content">

      <!-- ===== DASHBOARD ===== -->
      <section id="section-dashboard" class="content-section active">
        <h1>Dashboard</h1>

        <div class="stat-grid">
          <div class="stat-card">
            <h3>Total Obat</h3>
            <p id="totalObat">0</p>
          </div>
        </div>

        <div class="chart-card">
          <canvas id="stokChart"></canvas>
        </div>
      </section>

      <!-- ===== DATA OBAT ===== -->
      <section id="section-data-obat" class="content-section">
        <div class="section-header-flex">
          <div>
            <h1>Data Obat</h1>
            <p>Daftar lengkap semua obat</p>
          </div>

          <button onclick="openTambahModal()" class="btn-primary">
            ➕ Tambah Obat
          </button>
        </div>

        <div class="data-tools">
          <input type="text" id="filterObatInput" placeholder="🔍 Filter obat..." />
          <select id="filterStatusInput">
            <option value="">Semua Status</option>
            <option value="kadaluarsa">Kadaluarsa</option>
            <option value="hampir">Hampir Kadaluarsa</option>
            <option value="baik">Baik</option>
          </select>
          <button id="exportBtn" class="btn-secondary">Export CSV</button>
        </div>

        <div class="table-card">
          <table>
            <thead>
              <tr>
                <th>Nama</th>
                <th>Jumlah</th>
                <th>Kadaluarsa</th>
                <th>Status</th>
                <th>VED</th>
                <th>Aksi</th>
              </tr>
            </thead>
            <tbody id="tableObat"></tbody>
          </table>
        </div>
      </section>

      <!-- ===== KELUAR ===== -->
      <section id="section-keluar" class="content-section">
        <h1>Keluar Obat (FEFO)</h1>
        <button id="keluarBtn" class="btn-primary full">
          🔄 Keluar 1 Unit
        </button>
      </section>

      <!-- ===== VED ===== -->
      <section id="section-ved-fefo" class="content-section">
        <h1>Klasifikasi VED</h1>

        <div class="ved-container">
          <div>
            <h3>V - Vital</h3>
            <ul id="vedVList"></ul>
          </div>
          <div>
            <h3>E - Essential</h3>
            <ul id="vedEList"></ul>
          </div>
          <div>
            <h3>D - Desirable</h3>
            <ul id="vedDList"></ul>
          </div>
        </div>
      </section>

    </div>
  </main>
</div>

<!-- ===== MODAL TAMBAH OBAT ===== -->
<div id="tambahModal" class="modal">
  <div class="modal-content">
    <h3>Tambah Obat Baru</h3>

    <input type="text" id="modalNama" placeholder="Nama Obat">
    <input type="number" id="modalJumlah" placeholder="Jumlah">
    <input type="date" id="modalKadaluarsa">

    <div class="modal-actions">
      <button onclick="closeTambahModal()" class="btn-secondary">Batal</button>
      <button onclick="submitTambahObat()" class="btn-primary">Simpan</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="/app.js"></script>

</body>
</html>
