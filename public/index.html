<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="refresh" content="0;url=/login.html">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Redirecting…</title>
    <script src="/runtime-config.js"></script>
  </head>
  <body>
    <p>Jika tidak redirect otomatis, klik <a href="/login.html">Login</a>.</p>
    <script>
      try {
        const runtimeBase = (window.__APP_BASE_URL || '').replace(/\/$/, '');
        window.location.replace(runtimeBase ? (runtimeBase + '/login.html') : '/login.html');
      } catch(e){}
    </script>
  </body>
</html>
