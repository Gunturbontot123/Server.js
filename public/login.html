<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - ObatQU.id</title>
  <link rel="stylesheet" href="/style.css"/>
</head>
<body class="login-body">
  <div class="login-container card">
    <div class="login-brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
          <rect x="2" y="7" width="20" height="10" rx="5" ry="5" />
          <rect x="3.6" y="8.6" width="9.8" height="7" rx="3.5" ry="3.5" fill="rgba(255,255,255,0.18)" />
        </svg>
      </div>
      <div class="title">obat.Qu</div>
    </div>
    <h1>Selamat Datang</h1>
    <h2>Masuk ke obat.Qu — Sistem Manajemen Apotek</h2>

    <div id="alert" style="display:none;color:#eb422f;margin-bottom:10px;"></div>

    <form id="loginForm" autocomplete="off" data-form-type="other">
      <div class="form-group">
        <label>Username</label>
        <input id="username" name="loginId" placeholder="Masukkan username atau email" autocomplete="off" autocapitalize="off" spellcheck="false" />
      </div>

      <div class="form-group">
        <label>Password</label>
        <div class="input-pass">
          <input id="password" name="loginSecret" type="password" placeholder="••••••" autocomplete="off" />
          <button type="button" class="pass-toggle" id="togglePass" aria-label="Tampilkan password">👁️</button>
        </div>
      </div>

      <div class="form-group" style="display:flex; align-items:center; gap:10px;">
        <label style="font-weight:500;"><input type="checkbox" id="rememberMe" style="margin-right:8px;"> Ingat Saya</label>
      </div>

      <button class="btn-login" type="submit" id="btnLogin">Masuk</button>
    </form>

    <div class="login-footer">
      <a href="/reset-password.html" id="forgotLink" style="color:var(--primary-green); text-decoration:underline;">Lupa password?</a>
      <div style="color:var(--text-dark);">Belum punya akun? <a href="/register.html" id="registerLink" style="color:var(--primary-green); text-decoration:underline;">Daftar sekarang</a></div>
    </div>
  </div>

<script>
// when opened from file://, use localhost API
const API_BASE = (location && location.protocol === 'file:') ? 'http://localhost:3000' : '';

// remember username if chosen
document.addEventListener('DOMContentLoaded', ()=>{
  const saved = localStorage.getItem('rememberUsername');
  if (saved) { document.getElementById('username').value = saved; document.getElementById('rememberMe').checked = true; }
});

// toggle password visibility
document.getElementById('togglePass').addEventListener('click', (e)=>{
  e.preventDefault();
  const p = document.getElementById('password');
  if (p.type === 'password') { p.type = 'text'; document.getElementById('togglePass').textContent = '🙈'; }
  else { p.type = 'password'; document.getElementById('togglePass').textContent = '👁️'; }
});

// Login handler - use button click for reliability
document.getElementById('btnLogin').addEventListener('click', async (e) => {
  e.preventDefault();
  const el = document.getElementById('alert');
  el.style.display = 'none';
  el.textContent = '';
  
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  
  if (!username || !password) {
    el.style.display = 'block'; 
    el.textContent = 'Username dan password harus diisi.'; 
    return;
  }
  
  // Build payload: send as email if contains @, else as username
  const payload = username.includes('@') ? { email: username, password } : { username, password };
  
  // Persist username if remember checked
  try { 
    if (document.getElementById('rememberMe').checked) {
      localStorage.setItem('rememberUsername', username);
    } else {
      localStorage.removeItem('rememberUsername');
    }
  } catch(err){}
  
  try {
    console.log('📤 Sending login request:', JSON.stringify(payload));
    
    const res = await fetch((API_BASE ? API_BASE : '') + '/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      // Important for file:// -> localhost flow so session cookie is persisted.
      credentials: 'include',
      body: JSON.stringify(payload)
    });
    
    const data = await res.json().catch(()=>({message:'Response not JSON'}));
    console.log('📥 Response:', res.status, data);
    
    if (res.ok && data.user) {
      console.log('✅ Login berhasil, redirect ke dashboard...');
      try { localStorage.setItem('showWelcomeOnNextVisit','1'); } catch (e) {}
      setTimeout(() => {
        window.location = (API_BASE ? API_BASE + '/dashboard.html' : '/dashboard.html');
      }, 250);
    } else {
      el.style.display = 'block'; 
      el.textContent = data.message || data.error || 'Login gagal';
    }
  } catch (err) {
    console.error('❌ Error:', err);
    el.style.display = 'block'; 
    el.textContent = 'Gagal terhubung ke server: ' + err.message;
  }
});

// Also allow Enter key to submit
['username','password'].forEach(id => {
  document.getElementById(id).addEventListener('keypress', (e) => {
    if (e.key === 'Enter') { 
      e.preventDefault();
      document.getElementById('btnLogin').click(); 
    }
  });
});
</script>
</body>
</html>
